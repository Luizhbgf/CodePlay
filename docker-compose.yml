services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codeplay}
      POSTGRES_USER: ${DB_USER:-codeplay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    volumes:
      - codeplay-postgres:/var/lib/postgresql/data
      - ./codeplay-backend/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-codeplay} -d ${DB_NAME:-codeplay}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./codeplay-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_NAME: ${DB_NAME:-codeplay}
      DB_USER: ${DB_USER:-codeplay}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      DB_HOST: database
      DB_PORT: 5432
      CORS_ORIGIN: http://localhost:8081
    depends_on:
      database:
        condition: service_healthy
    ports:
      - '3000:3000'

  app:
    build: .
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3000/api
    depends_on:
      - api
    ports:
      - '8081:8081'

volumes:
  codeplay-postgres:
